<!doctype html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#345995">
    <title>RutinKu · Offline</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f7fb; color: #1f2937; }
        main { width: min(88%, 28rem); padding: 2rem; text-align: center; border-radius: 1.25rem; background: #fff; box-shadow: 0 1rem 3rem rgba(31, 41, 55, .12); }
        img { width: 6rem; height: 6rem; border-radius: 1.5rem; }
        h1 { margin-bottom: .5rem; }
        p { color: #64748b; line-height: 1.6; }
        button { min-height: 3rem; padding: .65rem 1.25rem; border: 0; border-radius: .75rem; background: #345995; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/assets/icons/icon-192.png" alt="Ikon RutinKu">
    <h1>Anda sedang offline</h1>
    <p>RutinKu memerlukan sambungan internet untuk memuatkan data keluarga yang terkini. Tiada halaman atau data authenticated disimpan dalam cache.</p>
    <button type="button" onclick="window.location.reload()">Cuba semula</button>
</main>
</body>
</html>
